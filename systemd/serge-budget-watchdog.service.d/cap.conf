# Serge paid-spend caps (rewritten 2026-07-22).
#
# HISTORY / WHY THIS FILE IS DANGEROUS: from 2026-06-26 until 2026-07-22 this
# drop-in carried SERGE_DAILY_CAP_USD=10, a leftover from the old whole-router
# watchdog. It SILENTLY OVERRODE the $3 default that budget-watchdog.sh
# documents in its own header, so the real daily runaway guard was $10. On
# 2026-07-22 a fallback storm billed $6.19 of Haiku 4.5 in one day and never
# tripped a cap. A systemd Environment= override always wins over the script
# default -- if you change a cap, change it HERE, and keep it in sync with the
# header comment in ~/.serge/budget-watchdog.sh.
#
# Daily runaway guard. The month is $20 (SERGE_MONTHLY_CAP_USD, enforced
# separately and never liftable); this bounds how much a single bad day -- a
# dead free seat, a retry storm, a runaway loop -- can take out of it.
# `serge --uncap` lifts THIS cap for today only.
[Service]
Environment="SERGE_DAILY_CAP_USD=1"
