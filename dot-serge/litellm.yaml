litellm_settings:
  drop_params: true        # tolerate OpenAI params providers don't accept
  request_timeout: 600     # long cloud reasoning
  num_retries: 2           # retry transient PRE-stream failures (429/5xx/network)
                           # before they surface as a mid-task "random stop".
                           # Mid-stream provider errors are handled by
                           # router_settings.fallbacks below (litellm 1.88
                           # MidStreamFallbackError → switch model group).

# Fallbacks fire ONLY on error (throttle / 5xx / mid-stream drop). Chains hop
# PROVIDERS (Mistral → Gemini buckets; Cerebras ⇄ Gemini) so one account's limits
# or outage never collapses a chain. Driver-reachable chains end on a PAID rung
# (cheap-paid) — Serge must not brick mid-task; text-only lanes stay free-only
# and fail loudly if every free pool is down. sonnet-paid and opus-paid are in
# no chain at all.
#
# COST NOTE (2026-07-22): the terminal rung is the seat that absorbs a whole
# free-hive outage, so it is the seat whose PRICE decides what a bad day costs.
# When it was haiku-paid ($1/$5), one such day — Mistral 401-dead, Gemini
# buckets day-capped — billed $6.19. It is now cheap-paid ($0.11/$0.80), and
# haiku-paid sits one step further out as cheap-paid's own fallback, so Haiku
# bills only if Qwen is ALSO down rather than on every free-tier hiccup.
router_settings:
  # ── MISTRAL SHARES ONE ~60/min ACCOUNT BUDGET (2026-08-15) ─────────────────
  # The per-seat rpm values below used to sum to 80/min across five Mistral
  # deployments, but the free tier's ~1 req/s limit is charged to the ACCOUNT,
  # not the model. litellm enforces rpm per DEPLOYMENT, so it never throttled
  # before Mistral did: serge's own fan-out (driver on local-coder + auto-consult
  # on think-coder + a scout on fast-coder + WebFetch on search-fast) reliably
  # tripped a 429. With RateLimitErrorAllowedFails: 0 and cooldown_time: 900
  # below, one such 429 exiled the WORKHORSE for fifteen minutes — and ~90% of
  # turns run on it, so the whole session silently degraded to fallback rungs.
  # Caught live: seat-health reported `local-coder DRIFT — answered by
  # nvidia/nemotron-3-super-120b-a12b:free` while mistral-large-latest answered
  # a direct probe in 0.6s. The seat was healthy; the router had benched it.
  #
  # Two changes, prevention and recovery:
  #   - rpm now sums to 50/min, so litellm queues BEFORE Mistral refuses.
  #   - each Mistral deployment carries `cooldown_time: 60`. Per-deployment
  #     cooldown beats the router default (router.py:7311, priority is
  #     deployment > Retry-After header > default), so a per-second limit
  #     recovers in a minute while Gemini's per-DAY walls keep the 900s below.
  #     Cooling a self-clearing limit for 15 minutes was the disproportionate
  #     part, not cooling it at all.
  # ── ANTI-HAMMER / don't-get-banned settings (2026-07-29) ────────
  # LiteLLM's DEFAULT cooldown_time is **5 seconds** (verified by introspecting
  # the installed litellm 1.88.1: litellm.constants.DEFAULT_COOLDOWN_TIME_SECONDS
  # == 5). Serge set no override, so a deployment that had definitively refused
  # us was re-tried every 5s indefinitely. Two real incidents in this system are
  # exactly that shape:
  #   - Gemini free is 20 requests/DAY per project per model (confirmed live from
  #     the 429 body: quotaId GenerateRequestsPerDayPerProjectPerModel-FreeTier,
  #     quotaValue 20). It does not recover until UTC midnight, so a 5s cooldown
  #     means ~10,000 pointless calls at a wall that already said no.
  #   - The Mistral key was revoked (401) and hammered for EIGHT DAYS unnoticed.
  # Google restricts projects for "attempts to circumvent quota restrictions",
  # so retrying a hard quota wall thousands of times a day is the behaviour most
  # likely to actually get an account flagged. This block stops it.
  #
  # 900s (15 min) is the deliberate middle: 180x fewer wasted calls than the 5s
  # default, while still recovering within 15 min of a UTC-midnight quota reset.
  # A cooled deployment is NOT an outage here — the fallback graph below routes
  # around it, which is the whole point of having the graph.
  cooldown_time: 900
  allowed_fails_policy:
    # A 429 means "you are hitting me too hard" — the one error where retrying
    # is itself the problem. 0 = cool the deployment on the FIRST occurrence.
    RateLimitErrorAllowedFails: 0
    # A revoked/invalid key never fixes itself by being asked again. This is the
    # 8-day Mistral 401. Cool it immediately; seat-health.sh reports the DRIFT.
    AuthenticationErrorAllowedFails: 0
    # Transient provider-side noise — forgive a couple before cooling, so one
    # blip does not push the workhorse onto the scarce Gemini buckets.
    InternalServerErrorAllowedFails: 2
    TimeoutErrorAllowedFails: 2
    # A 400/content-policy rejection is OUR request being malformed, not the
    # provider being unhealthy (e.g. the Cerebras 8,192-token overflow). Cooling
    # a healthy deployment for our own bug would be wrong, and would not help.
    BadRequestErrorAllowedFails: 1000
    ContentPolicyViolationErrorAllowedFails: 1000
  # Cap in-flight requests per deployment. Serge fans out parallel subagents
  # (hive/council), and an unbounded fan-out is a burst that looks like abuse
  # against free seats whose rpm is 8-12. Bursts queue instead of stampeding.
  default_max_parallel_requests: 4

  fallbacks:
    # ── DRIVER-REACHABLE GRAPH RULE (2026-07-21, observed live): a fallback
    # hop ENTERS the new group, so the walk can continue down THAT group's
    # chain — the reachable set is the transitive closure, not the listed
    # chain. And Cerebras GLM/gpt-oss return HTTP 200 with EMPTY content when
    # reasoning eats max_tokens, which TERMINATES the walk as a "success".
    # Therefore: no group a driver walk can enter may point into Cerebras,
    # chains walk FORWARD-ONLY toward the paid anti-brick rung (no cycles),
    # and cheap-paid is the terminal rung of every driver-reachable group.
    # Cerebras models stay addressable by explicit name (free-scout/glm-coder/
    # free-brain/qwen-coder) for single-shot TEXT, where empty-on-budget is
    # visible to the caller.
    - local-coder: ["free-flash25", "free-flash3", "free-flash", "free-qwen", "cheap-paid"]
    - pro-coder: ["free-flash3", "free-flash"]
    - qwen-coder: ["pro-coder", "free-flash"]
    - glm-coder: ["free-flash", "pro-coder"]
    - kimi-coder: ["cheap-paid", "local-coder"]
    # fast-coder runs agentic tool loops (scout) — Gemini buckets drive Claude
    # Code fine; terminal paid rung rather than a Cerebras dead-end.
    - fast-coder: ["free-flash", "cheap-paid"]
    # search-fast is the WebFetch summarizer. First hop is deliberately a
    # DIFFERENT provider (Mistral primary → Gemini) so one provider's rate limit
    # cannot take the summarizer down with the driver. It then inherits the
    # standard forward-only walk to the paid anti-brick rung, same as every
    # other group — a summarization call is tiny, and total free exhaustion is
    # the only path that reaches it.
    - search-fast: ["free-flash", "free-flash3"]
    # think-coder is a text lane — gpt-oss (its old model) is a fine fallback.
    # 2026-07-29: free-reason goes FIRST. It is the only free seat that both
    # reasons and drives tools, so a think-coder outage now degrades to another
    # reasoner instead of straight to a plain text model.
    - think-coder: ["free-reason", "free-brain", "pro-coder"]
    # free-reason is ENTERED by the think-coder walk, so per the graph rule above
    # it needs its OWN entry or the walk dead-ends here (the 2026-07-09
    # "No fallback model group found" failure). Forward-only to the paid rung.
    - free-reason: ["free-qwen", "cheap-paid"]
    - free-scout: ["free-flash", "pro-coder"]
    # free-flash is the pivot group most driver walks pass through — forward-
    # only (free-qwen → paid), no pro-coder edge (cycle + shared Lite bucket).
    - free-flash: ["free-qwen", "cheap-paid"]
    # free-flash3/free-flash25 need their OWN entries: LiteLLM's mid-stream
    # fallback looks up the CURRENT model group, so a chain that hops INTO a
    # rung with no entry dead-ends there (observed live 2026-07-09: pro-coder
    # 503 → free-flash3 503 → "No fallback model group found").
    # 2026-07-21: cheap-paid appended as the FINAL rung of the free DRIVER
    # buckets — observed live: with Mistral dead (401) + Gemini day-capped,
    # the workhorse's fallback walk hopped into free-flash's chain and
    # dead-ended on Cerebras GLM (agentic-hang, reasoning eats max_tokens)
    # WITHOUT ever reaching the workhorse chain's own paid last rung. The
    # anti-brick rung must be reachable from every group the driver walk can
    # land in. Cerebras text lanes stay free-only. Billing stays bounded by
    # budget-watchdog ($3/day / $20/month) + the paid-seat tripwire.
    - free-flash3: ["free-flash", "cheap-paid"]
    - free-flash25: ["free-flash3", "free-flash", "cheap-paid"]
    - free-qwen: ["cheap-paid"]
    # cheap-paid is ENTERED by walks, so per the graph rule above it needs its
    # own entry or it dead-ends there. Haiku is the one step past it: reaching
    # this rung means four providers (Mistral, Google, Cerebras-free, Alibaba)
    # all failed in a single turn, which is rare enough to be worth $1/$5.
    # haiku-paid deliberately has NO entry — it is the end of the road, and a
    # walk that exhausts it should fail loudly rather than shop for more spend.
    - cheap-paid: ["haiku-paid"]
    - free-brain: ["pro-coder", "free-flash"]
    # Brain seats host AGENTIC work (specialist agents, --cloud sessions,
    # vision turns), so their chains hop Gemini BUCKETS (each a separate
    # ~20/day per-model quota, all drive Claude Code fine) and end on the
    # Mistral driver — never on Cerebras gpt-oss, which hangs agentic loops
    # (was the FIRST rung here until 2026-07-10; a brain-quota day-cap would
    # strand every specialist agent on it). free-brain stays reachable by
    # name for single-shot text.
    # 2026-07-21: brain seats are DRIVERS (specialist agents, --cloud, vision)
    # — same graph rule applies: terminal paid rung so a Gemini-capped day with
    # Mistral down degrades to a working paid turn instead of a 401 dead-end.
    - cloud-brain: ["free-flash3", "free-flash25", "free-flash", "local-coder", "cheap-paid"]
    - bedrock-brain: ["free-flash3", "free-flash25", "free-flash", "local-coder", "cheap-paid"]
