# Serge model router (LiteLLM proxy) — ALL-FREE roster (2026-07-07).
# The design goal is that a full setup costs nothing. Every working
# seat is a $0 free-tier model; AWS Bedrock survives only as (a) the very last
# fallback rung of the workhorse chain and (b) explicitly-named paid escape
# hatches (kimi-coder, haiku-paid, opus-paid). Keys in router.env:
# CEREBRAS_API_KEY (cloud.cerebras.ai) + GEMINI_API_KEY (aistudio.google.com) +
# MISTRAL_API_KEY (console.mistral.ai; landed 2026-07-09 — now drives the workhorse) +
# ZAI_API_KEY (z.ai/manage-apikey/apikey-list; landed 2026-08-14 — the only free GLM
# route left, 200K ctx, and a fifth independent provider).
#
# ⚠ PROVIDER CONCENTRATION: OPENROUTER_API_KEY and OPENROUTER_PAID_API_KEY are the
# SAME credential, so every OpenRouter seat — free rungs AND the paid anti-brick rung
# — dies on a single revocation. That is the main reason Z.AI was worth adding.
#
# Seats ("the hive"):
#   local-coder → Mistral Large (free tier)     — default workhorse ($0; flipped 2026-07-09
#                                                 per FLIP-WHEN-KEYED: the only free pool
#                                                 that is BOTH big (~1B tok/mo) and agentic-
#                                                 capable; Gemini buckets are now fallbacks)
#   pro-coder   → Gemini 3.1 Flash-Lite-preview — live-fact / classifier escalation ($0; was Sonnet 4.6.
#                                                 -preview id since 2026-08-14: the plain id shares
#                                                 free-flash's daily bucket, defeating the whole point)
#   qwen-coder  → Nemotron-3.5-Lightning (OpenRouter :free) — reviewer/test/devops ($0; non-GLM ON
#                                                 PURPOSE: independent second opinion vs the workhorse.
#                                                 Off Cerebras gpt-oss-120b 2026-08-14 — that free tier
#                                                 caps ~30K TPM vs our ~74,700 median, so this seat had
#                                                 been silently demoting 3 agents + the stop-hook review
#                                                 path to gemini-3.1-flash-lite)
#   glm-coder   → GLM-4.7-Flash (Z.AI free)     — explicit GLM alias ($0, 200K ctx; ZAI_API_KEY landed
#                                                 2026-08-14. Cerebras GLM-4.7 is 8,192-capped and
#                                                 Mistral's glm-5-2 is entitlement-gated, so Z.AI direct
#                                                 is the ONLY free GLM route left)
#   kimi-coder  → Kimi K2.5 (OpenRouter, PAID)  — explicit-name escape hatch; only bills when named
#   fast-coder  → Devstral Medium (Mistral free) — scout/burst fan-outs ($0; agentic-built,
#                                                 repointed 2026-07-10 off Cerebras)
#   think-coder → Magistral Medium (Mistral free) — deep reasoner, adversarial passes ($0;
#                                                 true thinking model, 2026-07-10)
#   cloud-brain → Gemini 3.7 Flash / bedrock-brain → Gemini 3.6 Flash — hardest reasoning
#                                                 + VISION ($0; was Opus 4.6; free cap is
#                                                 20 req/day PER MODEL, which is why these two
#                                                 sit on DIFFERENT ids — that doubles the
#                                                 brain-class budget. Both upgraded a
#                                                 generation 2026-08-14; bedrock-brain is
#                                                 SERGE_VISION_MODEL and its vision was
#                                                 re-verified before the move)
#   free-scout / free-flash / free-brain        — addressable free seats (Z.AI GLM-4.7-Flash /
#                                                 Gemini 3.1 Flash-Lite / Cerebras gpt-oss.
#                                                 free-brain is a SMALL-request lane only:
#                                                 ~30K TPM, cannot serve a full-context turn)
#   free-large  → Mistral Large (free tier)     — ACTIVE 2026-07-09; explicit-name alias of the workhorse
#   free-reason → Nemotron-3-Nano-Omni-30B Reasoning (OpenRouter :free) — the only free seat
#                                                 that BOTH reasons and drives tools; first
#                                                 fallback for think-coder (2026-07-29)
#   free-qwen   → 3× OpenRouter :free (Nemotron-3-Ultra-550B / Nemotron-3-Super-120B / Ling-3.0-Flash)
#                                                 — 4th-provider rung before cheap-paid. Was Qwen3
#                                                 Coder 480B until OpenRouter killed the :free
#                                                 route; repointed + probe-verified 2026-07-27
#   cheap-paid  → Qwen3-Coder-Next (OpenRouter, PAID $0.11/$0.80) — the anti-brick
#                                                 terminal rung of every driver chain (2026-07-22)
#   haiku-paid  → Claude Haiku 4.5 (OpenRouter, PAID $1/$5) — DEMOTED 2026-07-22: no
#                                                 longer an automatic rung (it billed $6.19
#                                                 in one day that way); now explicit-name
#                                                 only, plus cheap-paid's own last resort
#   sonnet-paid → Claude Sonnet 5 (OpenRouter, PAID $2/$10) — explicit-only mid-tier brain
#   opus-paid   → Claude Opus 4.8 (OpenRouter, PAID $5/$25) — explicit-only heavy escalation;
#                                                 in NO fallback chain (fail loudly > silent billing)
#   PAID BUDGET (opt-in; nothing bills unless a paid key is set AND a paid
#   seat is named): all paid seats ride OPENROUTER_PAID_API_KEY; budget-watchdog
#   locks THAT key at $1/day / $20/month real spend (OpenRouter's own numbers)
#   and restores on rollover — free seats are never touched. The daily figure
#   was $3 on paper but a stale systemd drop-in made it $10 in reality, which
#   is how a $6.19 day went uncapped; it is $1 in BOTH places as of 2026-07-22.
#   Bedrock is not wired up; no AWS credentials are required.
#
# Constraints that shaped this (probes 2026-07-07):
#   - No free Claude/Kimi exists anywhere → their seats went to the best free
#     non-Anthropic models; paid originals kept addressable by explicit name.
#   - Gemini free tier is FLASH-ONLY now: all Pro variants (2.5-pro,
#     3-pro-preview, 3.1-pro-preview) 429 "check your plan" on a fresh key.
#     gemini-3.5-flash / 3-flash-preview / 3.1-flash-lite verified working.
#     Flash quota ≈ 1,500 req/day, ~1M TPM shared per project.
#   - Cerebras free ≈ 30 RPM / ~60K TPM / ~1M tokens/day per ACCOUNT — all
#     Cerebras seats share it; guards sit under it and 429s spill to Gemini.
#   - NO free prompt caching → the big constitution prefix re-bills nothing but
#     re-SENDS every turn (latency, TPM). Cerebras GLM-4.7 spends completion
#     tokens on reasoning first — keep max_tokens headroom or replies come back
#     empty.
#   - Free tiers may train on inputs (Google explicitly) — NEVER route secrets
#     or credentials through free seats.
#   - Groq rejected (6-12K TPM too small for Serge's prefix); NVIDIA NIM
#     rejected (opaque credit model). Mistral staged (free ≈1B tokens/month).
#   - Fallback chains hop PROVIDERS (Cerebras ⇄ Gemini) so one account's
#     limits/outage never collapses a whole chain.
model_list:
  # Default workhorse — Gemini 2.5 Flash free tier (repointed 2026-07-07 from
  # Bedrock Haiku 4.5; old seat preserved as haiku-paid). Why not the fancier
  # options: Cerebras GLM-4.7 failed the eval gate as an AGENTIC DRIVER
  # through Claude Code (tool-heavy tasks hang or return empty reasoning-only
  # content; one run claimed output it never verified — text lanes were fine,
  # so GLM keeps the scout/alias seats); gemini-3.5-flash free tier is only
  # 20 REQUESTS/DAY (measured 2026-07-07: quotaId
  # GenerateRequestsPerDayPerProjectPerModel-FreeTier=20), so it brains, not
  # workhorses. CORRECTION (same evening): 2.5-flash's free bucket is ALSO
  # just 20/day (measured) — so the workhorse chain hops Gemini BUCKETS
  # (2.5-flash → 3-flash-preview → 3.1-flash-lite): quota is per-model, so
  # each hop is a fresh ~20/day. Cerebras CANNOT back this seat up — BOTH its
  # models (GLM-4.7 AND gpt-oss-120b) hang Claude Code's agentic loop,
  # eval-verified twice. FLIPPED 2026-07-09 (was FLIP-WHEN-KEYED): MISTRAL_API_KEY
  # landed, seat now drives on mistral-large-latest (free Experiment tier, ~1B
  # tokens/month, ≈1 req/s + 500K TPM per Mistral docs — check console if 429s
  # look premature). The old Gemini 2.5 Flash bucket is preserved as
  # free-flash25 so its separate ~20/day quota still backs the fallback chain.
  # MISTRAL WENT 402 ON 2026-08-15 ("Check your subscription") and was RESOLVED
  # the same day by rotating the key. Kept as a diagnosis note, because the
  # symptom pointed everywhere except the cause:
  #   - The monthly pool read 27.7M of ~1B (2.8%) — which looked like headroom
  #     but was evidence that nothing was being SERVED.
  #   - ~90% of turns request local-coder, so a dead deployment here dumped the
  #     entire main loop onto Gemini: 1443 requests against a ~20/day bucket.
  #     That is what surfaced to the user as repeated "Free-tier quota reached"
  #     notices — a Gemini message caused by a Mistral failure.
  #   - Editing router.env is NOT enough: systemd reads it via EnvironmentFile
  #     only at start, so the router must be restarted or it keeps serving with
  #     the old key.
  # Verify a rotation against a PURE-Mistral seat (free-large) — local-coder can
  # answer 200 from its Gemini co-deployment and hide a dead key.
  - model_name: local-coder
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 24
      cooldown_time: 60
      tpm: 450000

  # ── SECOND DEPLOYMENT: spread the workhorse off one account (2026-08-15) ────
  # ~90% of turns run on local-coder (see router_settings below), and until now
  # the group held ONE deployment, so every one of them landed on the same
  # Mistral account — the same account auto-consult, scouts, and search-fast are
  # already competing for. Measured that day: 1443 requests attributed to the
  # brain bucket, 27.7M Mistral tokens (2.8% of the ~1B/month pool), and a wall
  # of `litellm.MidStreamFallbackError ... 429`. The monthly quota was nowhere
  # near spent — it was the per-ACCOUNT rate ceiling, hit mid-stream, where
  # LiteLLM structurally cannot fall back because tokens are already on the wire.
  #
  # Adding another MISTRAL deployment would buy nothing: litellm enforces rpm per
  # deployment, but the free tier charges the account (the whole point of the
  # rpm-sum note in router_settings). Relief has to cross providers. Gemini
  # flash-lite is the right co-deployment — a genuinely separate bucket, and the
  # gauge shows it at 156 req against a big pool, i.e. nearly idle.
  #
  # rpm 8 against Mistral's 24 is deliberate. No routing_strategy is set, so
  # litellm uses simple-shuffle, which weights by rpm: ~75% stays on
  # mistral-large (the stronger coder, still the default experience) and ~25%
  # bleeds to Gemini. That is enough to keep the Mistral account under its
  # per-second ceiling without handing the main loop to a weaker model.
  #
  # No cooldown_time override here ON PURPOSE: the 60s override exists for
  # Mistral's per-SECOND limit. Gemini's walls are per-DAY, so this deployment
  # wants the 900s default from router_settings — a drained daily bucket that
  # returns after 60s just burns the retry budget.
  # rpm 8 against Mistral's 24: no routing_strategy is set, so litellm uses
  # simple-shuffle, which weights by rpm — ~75% stays on mistral-large (the
  # stronger coder) and ~25% bleeds to Gemini. That is enough to keep the
  # Mistral ACCOUNT under its per-second ceiling, which is what the whole
  # rpm-sum note in router_settings is about, without handing the main loop to
  # a weaker model.
  #
  # If Mistral dies again, raise this to 24 and drop Mistral's to 4 — that keeps
  # serge working on Gemini instead of paying a failed call plus a fallback hop
  # on ~75% of turns. Measured during the 402: in-group service went from 17% to
  # 70% of requests once the weights were flipped.
  - model_name: local-coder
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 8

  # Live-fact / classifier escalation seat — Classifier (SERGE_CLASSIFIER_MODEL)
  # and live-fact (SERGE_LIVEFACT_MODEL) are single-shot text calls, so lite
  # handles them, and a SEPARATE quota bucket keeps classifier churn from
  # draining the workhorse's 20/day.
  #
  # 2026-08-14: that separation was NOT actually happening. This seat pointed at
  # gemini-3.1-flash-lite — the exact model free-flash uses — so the two shared
  # one per-model daily bucket, and the qwen-coder → pro-coder → free-flash walk
  # hopped onto an already-exhausted quota twice in a row. Gemini's free quota is
  # counted per MODEL per project (quotaId
  # GenerateRequestsPerDayPerProjectPerModel-FreeTier), which is the whole reason
  # the roster spreads across model ids. Moved to the -preview id, which is a
  # distinct model id and therefore a distinct bucket; probe-verified callable
  # 2026-08-14 (listed ≠ callable on this key — 2.5-flash is still listed and
  # still 404s).
  - model_name: pro-coder
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: os.environ/GEMINI_API_KEY
      rpm: 12

  # Reviewer seat — the hive's independent second opinion. NOTE: model_name
  # stays "qwen-coder" ON PURPOSE — referenced by
  # ~/.serge/agents/{reviewer,test,devops}.md, review-on-stop.sh
  # (SERGE_REVIEW_MODEL default), gate-on-stop.sh, gate-on-constitution-edit.sh,
  # stop-checks.sh, and the startup menu.
  #
  # REPOINTED 2026-08-14 off cerebras/gpt-oss-120b. That model is NOT dead, but
  # its free tier caps at ~30,000 TOKENS PER MINUTE — measured live the same day:
  # 12K prompt OK (0.2s), 30K and 75K both HTTP 429 token_quota_exceeded. Serge's
  # median request is ~74,700 input tokens, so this seat 429'd on essentially
  # every REAL review and fell through its chain (pro-coder → free-flash, both
  # gemini-3.1-flash-lite) — i.e. three agents plus the stop-hook review path
  # were silently running on the weakest tier in the roster. Same failure family
  # as the 8,192-token GLM cap, one size class up. seat-health's 12K ctx probe
  # cannot see it: 12K is exactly the size that still passes.
  #
  # Nemotron-3.5-Lightning was chosen over the Mistral candidates to KEEP THIS
  # SEAT A DIFFERENT VOICE from the Mistral workhorse — an independent reviewer
  # that shares the driver's model is not an independent reviewer. Probe-verified
  # 2026-08-14 on all three gates: 75,020-token context, a real tool_call, and
  # coherent assistant text CONTINUING AFTER a tool result (0.7s — the gate that
  # rejected glm-4.7-flash and deepseek-v3.2 for the paid rung). 1M context.
  - model_name: qwen-coder
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 12
      tpm: 400000

  # Explicit GLM alias — kept because scripts and the startup menu reference the
  # name. THERE IS NO LONGER A FREE GLM ROUTE, verified 2026-08-14:
  #   - cerebras/zai-glm-4.7 → hard 8,192-token cap (400 context_length_exceeded
  #     reproduced at 12K, 30K and 75K). This is what the seat used to point at,
  #     and it had been reporting dead in NOTIFICATIONS.md every day since
  #     2026-07-29 — 17 consecutive days — without ever being repointed.
  #   - mistral glm-5-2 / zai-glm-5-2 (listed, 1M ctx, function-calling) → HTTP
  #     429 on a TEN-TOKEN request while sibling Mistral models answered fine
  #     seconds later ⇒ entitlement-gated, not rate-limited. Not on the free tier.
  #   - Z.AI GLM-4.7-Flash (200K ctx, free) is still the natural repair and
  #     ~/.serge/activate-zai.sh is already written to perform it — it needs a
  #     Z.AI API key, which is a USER action (https://z.ai, free, no card).
  #     Run it and this seat goes back to being a real GLM seat.
  # RESOLVED once a Z.AI key was supplied and activate-zai.sh ran clean:
  # this is a REAL GLM seat again — zai/glm-4.7-flash, 200K context,
  # $0. It briefly pointed at mistral/mistral-code-agent-latest as a stand-in;
  # that stand-in is no longer needed but stays probe-verified if it is ever
  # wanted back (75,007-token context, real tool_call, 0.6s continuation).
  # Z.AI free tier: ~1 req/s and ~1,000 req/day, so rpm: 20 leaves headroom.
  # litellm 1.88.1 resolves zai/glm-4.7-flash natively (provider `zai`, 200,000
  # max input, cost 0/0, supports_function_calling true) — no plumbing needed.
  # Gates passed on activation: 75,009-token context AND a real tool_call.
  - model_name: glm-coder
    litellm_params:
      model: zai/glm-4.7-flash
      api_key: os.environ/ZAI_API_KEY
      rpm: 20

  # PAID escape hatch — Kimi K2.5 via OpenRouter ($0.57/$2.85; repointed
  # 2026-07-21 off the dead Bedrock key). The only way this bills is someone
  # explicitly naming "kimi-coder". Kept because no free Kimi exists and the
  # user may want the old reviewer's exact voice back. Uses the PAID key so
  # the budget watchdog can lock paid seats without touching free-qwen.
  - model_name: kimi-coder
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.5
      api_key: os.environ/OPENROUTER_PAID_API_KEY
      rpm: 10

  # Burst/scout seat — Devstral Medium on the free Mistral pool (repointed
  # 2026-07-10 from Cerebras GLM-4.7; probe-verified on this key). Devstral is
  # Mistral's agentic-coding model — the scout runs grep/read TOOL LOOPS, and
  # both Cerebras models are eval-documented to hang Claude Code's agentic
  # loop, so the scout lane was hang-prone. Big pool (~1B tok/mo shared with
  # local-coder/think-coder; account ≈1 req/s — rpm kept low so scout bursts
  # queue instead of starving the driver). Bound to agents/scout.md.
  - model_name: fast-coder
    litellm_params:
      model: mistral/devstral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 8
      cooldown_time: 60
      tpm: 100000

  # search-fast — the ENGINE's summarizer seat (ANTHROPIC_SMALL_FAST_MODEL),
  # used by WebFetch to compress a fetched page before it enters context. Never
  # a reasoning seat.
  #
  # Why its own entry instead of pointing at free-flash: free-flash is, by the
  # fallbacks comment below, "the pivot group most driver walks pass through",
  # and it is capped at rpm 12. Sharing it means a research burst has the
  # summarizer and the driver competing for the same 12 req/min — and when the
  # summarizer loses, applyPromptToMarkdown FAILS OPEN and dumps up to
  # MAX_MARKDOWN_LENGTH (100k chars ≈ 25k tokens) of raw page into context.
  # Exactly the failure measured on 2026-07-27, four times running.
  #
  # So: different PROVIDER from the Gemini-heavy driver pivot, so summarizer
  # load and driver load cannot starve each other. Mistral devstral-medium
  # measured 1.1s on a 43KB page (vs 11.3s for mistral-large); tpm is generous
  # because each call carries a whole page.
  - model_name: search-fast
    litellm_params:
      model: mistral/devstral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 10
      cooldown_time: 60
      tpm: 200000

  # ---- Addressable free seats (added 2026-07-07 morning; kept for scripts
  # and explicit routing; now largely aliases of the main seats) ----

  # $0 scout alias. REPOINTED 2026-08-14 off cerebras/zai-glm-4.7 (hard 8,192
  # cap, re-verified dead the same day — see the glm-coder note above). This was
  # the single worst seat to leave capped: scouting unfamiliar code is inherently
  # LARGE-context, so every real scout call blew the cap and fell through to
  # gemini-3.1-flash-lite. It reported dead daily for 17 straight days.
  # It ran briefly on nemotron-3.5-lightning:free (1M ctx, all three gates passed
  # — the largest-context and fastest free model probed that day). Moved to Z.AI
  # GLM-4.7-Flash the same evening when the user's Z.AI key landed. That is a
  # DELIBERATE trade of headroom for provider diversity, made with the numbers on
  # the table: 200K is still 2.7x serge's ~74,700-token median and clears the
  # ~90,400 p90, while three seats had been leaning on OpenRouter :free — whose
  # free and paid keys are the SAME credential, so one revocation took them all.
  # Z.AI is a fifth independent provider. If a future workload genuinely needs
  # >200K here, nemotron-3.5-lightning:free is the verified way back.
  - model_name: free-scout
    litellm_params:
      model: zai/glm-4.7-flash
      api_key: os.environ/ZAI_API_KEY
      rpm: 20

  # $0 second Gemini pool — 3.1 Flash-Lite (GA; verified 2026-07-07).
  # Deliberately a DIFFERENT model than the 2.5-flash seats so Gemini-side
  # fallbacks don't re-hit the exhausted quota bucket: free RPD is counted
  # PER MODEL per project. Lite = weaker but the biggest free pool; it's a
  # fallback/bulk seat, not a driver.
  - model_name: free-flash
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 12

  # $0 driver bucket #2 — Gemini 3 Flash preview. Same family as the
  # workhorse (drives Claude Code fine) but a SEPARATE per-model daily
  # bucket, so the workhorse chain gets ~2x the daily driver budget.
  - model_name: free-flash3
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
      rpm: 8

  # $0 driver bucket #3 — its own ~20/day per-model bucket, so it still counts
  # toward the fallback chain's daily driver budget.
  #
  # 2026-07-29: WAS gemini/gemini-2.5-flash. On the rotated GEMINI_API_KEY that
  # model returns HTTP 404 "no longer available to new users" — permanently, for
  # every new project — and it sat FIRST in local-coder's fallback chain, so the
  # workhorse's first failover hop was a guaranteed dead end. gemini-2.5-flash-lite
  # is dead the same way. Re-pointed to 3.5-flash-lite, probe-verified callable.
  # NOTE: 2.5-flash is still LISTED by the models endpoint while being uncallable —
  # same listed-but-not-callable trap as the free-qwen rung. Probe, don't trust the list.
  - model_name: free-flash25
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 8

  # $0 reasoner — gpt-oss-120b (Cerebras production model).
  #
  # ⚠ SMALL-REQUEST LANE ONLY, and after the 2026-08-14 audit this is the LAST
  # seat still on Cerebras (qwen-coder, glm-coder and free-scout all moved off).
  # Measured live 2026-08-14: 12K prompt OK in 0.2s, 30K and 75K both HTTP 429
  # "Tokens per minute limit exceeded". Serge's median request is ~74,700 tokens,
  # so this seat CANNOT serve a full-context turn — it is fine for the short
  # single-shot text it was kept for, and nothing else. The declared tpm: 55000
  # above is aspirational, not what the free tier actually grants (~30K/min).
  # Do not promote this seat to anything agentic without re-probing at 75K.
  # Note the config tpm is left as-is deliberately: lowering it would make
  # LiteLLM queue rather than fail, hiding the cap instead of surfacing it.
  - model_name: free-brain
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 25
      tpm: 55000

  # Deep-reasoning utility seat — Magistral Medium on the free Mistral pool
  # (repointed 2026-07-10 from Cerebras gpt-oss-120b; probe-verified on this
  # key). A TRUE reasoning model (native thinking blocks, no dial needed) on
  # the ~1B tok/mo pool instead of Cerebras's ~1M tok/DAY — deep adversarial
  # fan-outs no longer compete with the reviewer for the tiny Cerebras budget.
  # gpt-oss stays addressable as free-brain and is this seat's fallback voice.
  - model_name: think-coder
    litellm_params:
      model: mistral/magistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 6
      cooldown_time: 60
      tpm: 100000

  # Cloud "brain" — hardest reasoning + VISION (= 'serge --cloud',
  # SERGE_VISION_MODEL). Repointed 2026-07-07 from Bedrock Opus 4.6 — which stays
  # addressable as opus-paid for genuinely hard escalations that are explicitly approved.
  #
  # ⚠ CALLER INVARIANT (thinking-by-default seats: cloud-brain, think-coder, and
  # the gpt-oss seats qwen-coder/free-brain). These spend output tokens on
  # reasoning FIRST, so a tight max_tokens returns HTTP 200 with `content: null`
  # and finish_reason "length" — a success-shaped empty answer. Any caller must
  # either budget generously (≥2000 for a real answer; measured empty at 400,
  # 1500 and even 4000 for Magistral) or read `content or reasoning_content`.
  # Never treat empty content as "nothing to report".
  #
  # 2026-07-29: 3.5-flash -> 3.6-flash, the newest callable Gemini flash on the
  # rotated key (probe-verified; no Pro variant has free quota — 3.1-pro-preview,
  # 3-pro-preview and 2.5-pro all 429). bedrock-brain below deliberately STAYS on
